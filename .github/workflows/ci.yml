name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
        # no network access needed: every test runs against fixture filings

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t sec-watch:ci .

      - name: Start in demo mode and check health
        run: |
          docker run -d --name sec-watch-ci -p 8080:8080 \
            -e SECWATCH_DEMO=1 sec-watch:ci
          docker exec sec-watch-ci python tools/demo_seed.py
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then echo "healthy"; exit 0; fi
            sleep 3
          done
          echo "did not become healthy"; docker logs sec-watch-ci; exit 1

      - name: Clean up
        if: always()
        run: docker rm -f sec-watch-ci || true
